<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorApp1</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorApp1.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-global.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-global.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-global.js"></script>

    <script>
        const firebaseConfig = { ... };
        firebase.initializeApp(firebaseConfig);

        // 이 부분이 window.signInWithGoogle 로 정확히 시작하는지 보세요.
        window.signInWithGoogle = async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                return {
                    uid: result.user.uid,
                    email: result.user.email,
                    displayName: result.user.displayName
                };
            } catch (error) {
                console.error(error);
                return null;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
