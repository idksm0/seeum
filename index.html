<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seeum</title>
    <base href="/seeum/" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="BlazorApp1.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 20%;">
            <h3>seeum 앱 로딩 중...</h3>
            <p>잠시만 기다려 주세요.</p>
        </div>
    </div>

    <script>
        // Firebase 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyB1IMP3Q9oW3dNwRcwDHKJ7dbA5Vep9YyA",
            authDomain: "seeum-35ae6.firebaseapp.com",
            projectId: "seeum-35ae6",
            storageBucket: "seeum-35ae6.firebasestorage.app",
            messagingSenderId: "266087616815",
            appId: "1:266087616815:web:44e8b598fc4d172a8d11da"
        };

        // 초기화 및 로그인 함수 정의
        try {
            firebase.initializeApp(firebaseConfig);
            window.signInWithGoogle = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    const result = await firebase.auth().signInWithPopup(provider);
                    return { uid: result.user.uid, email: result.user.email, displayName: result.user.displayName };
                } catch (error) {
                    console.error("로그인 에러:", error);
                    return null;
                }
            };
        } catch (e) {
            console.error("Firebase 세팅 에러:", e);
        }
    </script>

    <script autostart="false" src="_framework/blazor.webassembly.js"></script>
    <script>
        if (window.Blazor) {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // 깃허브 배포 시 integrity 에러를 피하기 위해 uri만 반환
                    return defaultUri;
                }
            });
        }
    </script>
</body>
</html>
