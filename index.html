<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seeum</title>
    <base href="/seeum/" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="BlazorApp1.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 20%;">
            <h3>seeum 앱 로딩 중...</h3>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1IMP3Q9oW3dNwRcwDHKJ7dbA5Vep9YyA",
            authDomain: "seeum-35ae6.firebaseapp.com",
            projectId: "seeum-35ae6",
            storageBucket: "seeum-35ae6.firebasestorage.app",
            messagingSenderId: "266087616815",
            appId: "1:266087616815:web:44e8b598fc4d172a8d11da"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            window.signInWithGoogle = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    const result = await firebase.auth().signInWithPopup(provider);
                    return { uid: result.user.uid, email: result.user.email, displayName: result.user.displayName };
                } catch (error) { return null; }
            };

            window.saveDataToFirestore = async (uid, jsonData) => {
                try {
                    await db.collection("users").doc(uid).set({
                        studyData: jsonData,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    return true;
                } catch (e) { return false; }
            };

            window.loadDataFromFirestore = async (uid) => {
                try {
                    const doc = await db.collection("users").doc(uid).get();
                    return doc.exists ? doc.data().studyData : null;
                } catch (e) { return null; }
            };
        } catch (e) { console.error(e); }
    </script>

    <script autostart="false" src="_framework/blazor.webassembly.js"></script>
    <script>
        if (window.Blazor) {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    return defaultUri;
                }
            });
        }
    </script>
    <script>
        // 학습 기록 저장 (날짜별 통계 및 오답 포함)
        window.saveStudyHistory = async (uid, historyData) => {
            try {
                const dateStr = new Date().toISOString().split('T')[0];
                await db.collection("users").doc(uid).collection("history").doc(dateStr).set({
                    ...historyData,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                return true;
            } catch (e) { return false; }
        };

        // 학습 기록 불러오기
        window.loadAllHistory = async (uid) => {
            try {
                const snapshot = await db.collection("users").doc(uid).collection("history").orderBy("updatedAt", "desc").get();
                const history = [];
                snapshot.forEach(doc => history.Add({ id: doc.id, ...doc.data() }));
                return JSON.stringify(history);
            } catch (e) { return null; }
        };
    </script>
</body>
</html>
